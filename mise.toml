[settings]
disable_backends = ["ubi", "asdf"]
lockfile = true

[tools]
# Runs .github/workflows/ci.yml on the Mac, and actionlint checks it before a commit.
act = "0.2.98"
actionlint = "1.7.12"
# Writes CHANGELOG.md and the Release notes.
git-cliff = "2.14.2"
uv = "0.13.7"
"aqua:koalaman/shellcheck" = "0.11.0"
# Audited 2026-11-19: 21 packages, wheels only, no known vulnerabilities.
"pypi:copier" = { version = "9.19.1", python = "3.14.10" }

[env]
# Also skips git-cliff's update check on crates.io, which its docs leave out.
GIT_CLIFF_OFFLINE = "true"
PYTHONPATH = false
PYTHONHOME = false
PIP_REQUIRE_VIRTUALENV = "true"
UV_PYTHON_DOWNLOADS = "never"
