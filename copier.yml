_subdirectory: template
_preserve_symlinks: true

# fbt packs the name into 32 ASCII bytes, the last kept for the NUL
# (scripts/fbt/elfmanifest.py:42), and it sits in a Python and a C string literal.
app_name:
    type: str
    help: The app's name in the Apps menu
    validator: >-
        {% if not (app_name | regex_search('^(?! )[ -!#-\\[\\]-~]{1,31}(?<! )$')) %}
        Use 1 to 31 printable ASCII characters, with no " or \ and no space at either end.
        {% endif %}

# fbt's own pattern for an appid (scripts/fbt/appmanifest.py:35).
app_id:
    type: str
    help: The app's id, its file name on the device
    default: "{{ app_name | lower | regex_replace('[^a-z0-9]+', '_') | trim('_') }}"
    validator: >-
        {% if not (app_id | regex_search('^[a-z0-9_]+$')) %}
        Use lowercase letters, digits and underscores.
        {% endif %}

# fbt installs the app under apps/<category>/ (scripts/fbt_tools/fbt_extapps.py:210).
app_category:
    type: str
    help: The Apps menu folder the app goes into, as Bluetooth or Tools
    validator: >-
        {% if not (app_category | regex_search('^[A-Za-z0-9][A-Za-z0-9 -]*$')) %}
        Use letters, digits, spaces and dashes.
        {% endif %}

# The catalog's short description. Kept out: what a Python string literal can't hold as typed,
# and what the catalog's Markdown filter refuses, as .catalog/description.md repeats it.
app_description:
    type: str
    help: One line on what the app does, for the Flipper Apps Catalog
    validator: >-
        {% if not (app_description | regex_search('^(?! )[^"\\\\`<&\\[\\]\\x00-\\x1f\\x7f]+(?<! )$')) %}
        Use one line with no " \ ` < & [ ] and no space at either end.
        {% endif %}

app_author:
    type: str
    help: The app's author, as the Flipper Apps Catalog shows it
    validator: >-
        {% if not (app_author | regex_search('^(?! )[^"\\\\\\x00-\\x1f\\x7f]+(?<! )$')) %}
        Use one line with no " or \ and no space at either end.
        {% endif %}

app_weburl:
    type: str
    help: The app's web page, as its repository
    validator: >-
        {% if not (app_weburl | regex_search('^https://[^\\s"\\\\]+$')) %}
        Use an https:// URL with no spaces, " or \.
        {% endif %}

# GitHub Pages serves a project's site at https://<owner>.github.io/<repo>/.
# The llmstxt plugin refuses to build without it (zensical/config.py:1942).
docs_url:
    type: str
    help: The docs site's address, where GitHub Pages serves it
    default: >-
        {% if app_weburl | regex_search('^https://github\\.com/[^/]+/[^/]+$') -%}
        https://{{ app_weburl | regex_replace('^https://github\\.com/([^/]+)/.*$', '\\1') | lower }}.github.io/{{ app_weburl | regex_replace('^https://github\\.com/[^/]+/', '') }}/
        {%- endif %}
    validator: >-
        {% if not (docs_url | regex_search('^https://[^\\s"\\\\]+/$')) %}
        Use an https:// URL ending in / with no spaces, " or \.
        {% endif %}

# Asked, so the answers file keeps the year and `copier update` leaves the notice as it was.
copyright_year:
    type: str
    help: The year in the copyright notice
    default: "{{ '%Y' | strftime }}"
    validator: >-
        {% if not (copyright_year | regex_search('^[0-9]{4}$')) %}
        Use a four-digit year.
        {% endif %}
