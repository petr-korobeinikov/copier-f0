[settings]
disable_backends = ["ubi", "asdf"]
lockfile = true

[tool_config]
locked = true

[tools]
actionlint = "1.7.12"
git-cliff = "2.14.2"
node = "26.13.1"
"aqua:astral-sh/uv" = "0.13.10"
"aqua:gittower/git-flow-next" = "2.1.0"
"aqua:j178/prek" = "0.5.12"
"aqua:koalaman/shellcheck" = "0.11.0"
"aqua:nektos/act" = "0.2.98"
"npm:@fission-ai/openspec" = "2.2.0"
"pypi:ufbt" = { version = "0.2.6", python = "3.15.2" }
# Builds docs/.
"pypi:zensical" = { version = "0.1.3", python = "3.15.2" }

[env]
OPENSPEC_TELEMETRY = "0"
# Also skips git-cliff's update check on crates.io, which its docs leave out.
GIT_CLIFF_OFFLINE = "true"
PYTHONPATH = false
PYTHONHOME = false
PIP_REQUIRE_VIRTUALENV = "true"
UV_PYTHON_DOWNLOADS = "never"
UFBT_HOME = "{{config_root}}/.ufbt"
PYTHONPYCACHEPREFIX = "{{config_root}}/.ufbt/pycache"
CCACHE_DISABLE = "1"
FLIPPER_SDK_VERSION = "1.5.1"
